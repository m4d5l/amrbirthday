<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday!</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    background: #fdf4ff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Segoe UI', sans-serif;
    overflow: hidden;
    position: relative;
  }

  /* confetti pieces */
  .confetti-piece {
    position: absolute;
    width: 10px;
    height: 10px;
    opacity: 0;
    animation: confettiFall linear forwards;
  }
  @keyframes confettiFall {
    0%   { transform: translateY(-20px) rotate(0deg); opacity: 1; }
    100% { transform: translateY(110vh) rotate(720deg); opacity: 0; }
  }

  .scene {
    text-align: center;
    padding: 2rem;
    max-width: 520px;
    width: 100%;
  }

  .cake {
    font-size: 80px;
    line-height: 1;
    margin-bottom: 1.2rem;
    display: inline-block;
    animation: bounce 2s ease-in-out infinite;
  }
  @keyframes bounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-10px); }
  }

  h1 {
    font-size: 2rem;
    font-weight: 700;
    color: #6b21a8;
    margin-bottom: 0.5rem;
  }

  .subtitle {
    font-size: 1rem;
    color: #9333ea;
    margin-bottom: 2rem;
  }

  /* Button area */
  #btn-area {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 16px;
    margin-bottom: 1rem;
    position: relative;
  }

  .btn-yes {
    padding: 14px 42px;
    font-size: 1rem;
    font-weight: 600;
    border: none;
    border-radius: 50px;
    cursor: pointer;
    background: #7c3aed;
    color: white;
    transition: transform 0.15s, background 0.2s;
    flex-shrink: 0;
    margin-right: 300px;
  }
  .btn-yes:hover { background: #6d28d9; transform: scale(1.05); }

  .btn-no {
    padding: 12px 36px;
    font-size: 1rem;
    font-weight: 600;
    border: 2px solid #e11d48;
    border-radius: 50px;
    cursor: pointer;
    background: white;
    color: #e11d48;
    transition: left 0.25s cubic-bezier(0.34,1.56,0.64,1), top 0.25s cubic-bezier(0.34,1.56,0.64,1), opacity 0.4s;
    white-space: nowrap;
    position: fixed;
    
  }
  .btn-no:hover { background: #fff1f2; }

  /* Hover popup picture — slides up slowly from bottom */
  #no-hover-pic {
    position: fixed;
    bottom: 0;
    left: 24px;
    width: 130px;
    border-radius: 16px 16px 0 0;
    overflow: hidden;
    border: 2.5px solid #131453;
    border-bottom: none;
    background: #fff1f2;
    opacity: 0;
    transform: translateY(100%);
    transition: transform 2.55s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.3s ease;
    pointer-events: none;
    z-index: 999;
  }
  #no-hover-pic.show {
    opacity: 1;
    transform: translateY(0);
  }
  #no-hover-pic img {
    width: 100%;
    height: 130px;
    object-fit: cover;
    display: block;
  }
  #no-hover-pic .pic-caption {
    background: #131453;
    color: white;
    font-size: 11px;
    font-weight: 600;
    text-align: center;
    padding: 5px 4px;
  }

  /* Rage card */
  #rage-card {
    display: none;
    background: white;
    border-radius: 20px;
    border: 1.5px solid #131453;
    padding: 1.5rem;
    margin-top: 1rem;
    animation: slideIn 0.4s ease;
  }
  @keyframes slideIn {
    from { opacity: 0; transform: translateY(16px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  #rage-card img {
    width: 140px;
    height: 140px;
    border-radius: 50%;
    object-fit: cover;
    border: 3px solid #162ba7;
    margin-bottom: 0.8rem;
  }

  .rage-label {
    font-size: 0.85rem;
    color: #131453;
    margin-bottom: 6px;
    font-weight: 600;
  }

  .rage-bar-track {
    width: 100%;
    height: 18px;
    background: #fee2e2;
    border-radius: 50px;
    overflow: hidden;
    border: 1px solid #162ba7;
  }

  .rage-bar-fill {
    height: 100%;
    width: 0%;
    background: #131453;
    border-radius: 50px;
    transition: width 0.4s ease;
  }

  #rage-msg {
    font-size: 0.82rem;
    color: #0323da;
    margin-top: 6px;
    min-height: 20px;
    font-style: italic;
  }

  /* Happy state */
  #happy-screen {
    display: none;
    animation: popIn 0.5s cubic-bezier(0.34,1.56,0.64,1);
  }
  @keyframes popIn {
    from { transform: scale(0.6); opacity: 0; }
    to   { transform: scale(1); opacity: 1; }
  }
  .big-celebrate { font-size: 5rem; margin-bottom: 1rem; }
  .happy-msg { font-size: 1.4rem; font-weight: 700; color: #6b21a8; }
  .happy-sub { font-size: 1rem; color: #9333ea; margin-top: 0.5rem; }
</style>
</head>
<body>

<div class="scene">

  <!-- Main question screen -->
  <div id="question-screen">
    <div class="cake">🎂</div>
    <h1>It's Amr's birthday! 🎉</h1>
    <p class="subtitle">Do you wish Amr a happy birthday?</p>

    <div id="btn-area">
      <button class="btn-yes" onclick="sayYes()">Sure My Share! 🎉</button>
    
      <button class="btn-no" id="btn-no" onclick="clickNo()">No You Bitch Ass Ugly Nigga 😒</button>
    </div>
    <div id="rage-card">
      <img id="rage-img" src="" alt="Sad face">
      <div class="rage-label" id="rage-label">Rage level: 0%</div>
      <div class="rage-bar-track">
        <div class="rage-bar-fill" id="rage-fill"></div>
      </div>
      <div id="rage-msg">Really?? Just say happy birthday...</div>
    </div>
  </div>

  <!-- Happy screen -->
  <div id="happy-screen">
    <div class="big-celebrate"><img id="rage-img" src="C:\Users\PCD\Desktop\amr\y.jpg" style="width: 140px;
    height: 180px;
    border-radius: 50%;
    object-fit: cover;
    border: 3px solid #fca5a5;
    margin-bottom: 0.8rem;" alt="Sad face"></div>
    <div class="happy-msg">Thats What i Thought!!</div>
    <div class="happy-sub">You're one of my shares! let's watch one piece 🎊🎈🎁</div>
  </div>

</div>

<!-- Hover popup picture bottom-left -->
<div id="no-hover-pic">
  <img id="hover-pic-img" src="https://api.dicebear.com/7.x/fun-emoji/svg?seed=pleading&backgroundColor=fee2e2" alt="Pleading face">
  <div class="pic-caption">Don't click No! 😢</div>
</div>

<script>
  /* ============================================================
     🖼️  YOUR IMAGES — add or swap image URLs here
     Each entry has:
       hover  : shown when the No button is hovered (bottom-left peek)
       rage   : shown inside the rage card after clicking No
       caption: text label shown on the hover picture
  ============================================================ */
  const IMAGES = [
    {
      hover:   "a.jpg",
      rage:    "IMG_20251116_213231.jpg",
      caption: "Don't click No! 😢"
    },
    {
      hover:   "a.jpg",
      rage:    "IMG_20251009_155725.jpg",
      caption: "Are you sure? 🥺"
    },
    {
      hover:   "a.jpg",
      rage:    "image.png",
      caption: "Why are you like this??"
    },
    {
      hover:   "a.jpg",
      rage:    "w.png",
      caption: "I can't believe you!"
    },
    {
      hover:   "a.jpg",
      rage:    "e.png",
      caption: "I'm SO angry now 😤"
    },
    {
      hover:   "a.jpg",
      rage:    "g.jpg",
      caption: "STOP IT!! 😤"
    },
    {
      hover:   "a.jpg",
      rage:    "f.png",
      caption: "That's it. I'm done. 😡"
    },
  ];

  /* ============================================================
     🔊  YOUR SOUNDS — one per rage level (matches IMAGES order)
     HOW TO USE:
       Option A — Use a sound file URL (mp3, wav, ogg):
         sound: "https://example.com/mysound.mp3"
         sound: "./my-audio-file.mp3"   (file in same folder)

       Option B — Use a built-in generated tone (no file needed):
         sound: null   ← plays the auto-generated tone for that level

     volume: 0.0 (silent) to 1.0 (loudest)
  ============================================================ */
  const SOUNDS = [
    { sound: "scene_sound_01.mp3", volume: 0.6 },  // level 1 — soft sad whimper tone
    { sound: "scene_sound_02.mp3", volume: 0.6 },  // level 2 — slightly more urgent
    { sound: "scene_sound_03.mp3", volume: 0.7 },  // level 3 — disappointed groan tone
    { sound: "scene_sound_04.mp3", volume: 0.7 },  // level 4 — shocked sting
    { sound: "scene_sound_05.mp3", volume: 0.8 },  // level 5 — angry buzz
    { sound: "scene_sound_06.mp3", volume: 0.9 },  // level 6 — alarm screech
    { sound: "scene_sound_07.mp3", volume: 1.0 },  // level 7 — full rage explosion
  ];
  /* ============================================================ */

  const rageMessages = [
    "Really?? Just say happy birthday...",
    "Come on, it's just two words!",
    "My shares would say it... 😤",
    "You will cry 😢",
    "FINE. Be that way!!",
    "I'm running out of patience...",
    "Last chance before I explode!! 😡",
  ];

  const maxRage = IMAGES.length;
  let currentAudio = null;

  let noCount = 0;
  let audioCtx = null;

  const noBtn = document.getElementById('btn-no');
  const hoverPic = document.getElementById('no-hover-pic');
  const hoverImg = document.getElementById('hover-pic-img');

  function getAudioCtx() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    return audioCtx;
  }

  /* Built-in generated tones — escalating from sad to explosive */
  function playGeneratedSound(level, volume) {
    const ctx = getAudioCtx();
    const gain = ctx.createGain();
    gain.connect(ctx.destination);
    gain.gain.setValueAtTime(0, ctx.currentTime);

    const configs = [
      /* 1 */ () => { playSine(ctx, gain, 440, 0.3, 'sine',     volume * 0.5); playSine(ctx, gain, 392, 0.3, 'sine', volume * 0.3, 0.15); },
      /* 2 */ () => { playSweep(ctx, gain, 500, 350, 0.4, 'sine', volume * 0.6); },
      /* 3 */ () => { playSine(ctx, gain, 300, 0.5, 'triangle', volume * 0.7); playSine(ctx, gain, 280, 0.5, 'triangle', volume * 0.4, 0.1); },
      /* 4 */ () => { playSweep(ctx, gain, 800, 200, 0.3, 'square', volume * 0.4); },
      /* 5 */ () => { playNoise(ctx, gain, 0.25, volume * 0.5); playSweep(ctx, gain, 600, 100, 0.4, 'sawtooth', volume * 0.5); },
      /* 6 */ () => { playSweep(ctx, gain, 1200, 400, 0.5, 'sawtooth', volume * 0.6); playNoise(ctx, gain, 0.3, volume * 0.4); },
      /* 7 */ () => { playNoise(ctx, gain, 0.6, volume * 0.7); playSweep(ctx, gain, 1500, 80, 0.7, 'sawtooth', volume * 0.6); playSine(ctx, gain, 60, 0.5, 'sine', volume * 0.5); },
    ];
    (configs[Math.min(level - 1, configs.length - 1)])();
  }

  function playSine(ctx, dest, freq, dur, type, vol, delay = 0) {
    const osc = ctx.createOscillator();
    const g = ctx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, ctx.currentTime + delay);
    g.gain.setValueAtTime(vol, ctx.currentTime + delay);
    g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + delay + dur);
    osc.connect(g); g.connect(dest);
    osc.start(ctx.currentTime + delay);
    osc.stop(ctx.currentTime + delay + dur + 0.05);
  }

  function playSweep(ctx, dest, freqStart, freqEnd, dur, type, vol) {
    const osc = ctx.createOscillator();
    const g = ctx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freqStart, ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(freqEnd, ctx.currentTime + dur);
    g.gain.setValueAtTime(vol, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + dur);
    osc.connect(g); g.connect(dest);
    osc.start(ctx.currentTime);
    osc.stop(ctx.currentTime + dur + 0.05);
  }

  function playNoise(ctx, dest, dur, vol) {
    const bufSize = ctx.sampleRate * dur;
    const buf = ctx.createBuffer(1, bufSize, ctx.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < bufSize; i++) data[i] = Math.random() * 2 - 1;
    const src = ctx.createBufferSource();
    src.buffer = buf;
    const g = ctx.createGain();
    g.gain.setValueAtTime(vol, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + dur);
    src.connect(g); g.connect(dest);
    src.start(ctx.currentTime);
  }

 

  function playSound(level) {
    const cfg = SOUNDS[Math.min(level - 1, SOUNDS.length - 1)];
    const vol = cfg.volume || 0.7;

    if (cfg.sound) {
        const audio = new Audio(cfg.sound);
        audio.volume = vol;

        audio.play().catch(() => {});
        return audio;
    } else {
        try {
            playGeneratedSound(level, vol);
        } catch (e) {}

        return null;
    }
}

  function placeNoBtnInitial() {
    const yesBtn = document.querySelector('.btn-yes');
    const yr = yesBtn.getBoundingClientRect();
    noBtn.style.left = (yr.right + 16) + 'px';
    noBtn.style.top  = yr.top + 'px';
  }

  function moveNoBtn() {
    const bW = noBtn.offsetWidth;
    const bH = noBtn.offsetHeight;
    const pad = 16;
    const maxX = window.innerWidth  - bW - pad;
    const maxY = window.innerHeight - bH - pad;
    let x, y, attempts = 0;
    do {
      x = pad + Math.floor(Math.random() * maxX);
      y = pad + Math.floor(Math.random() * maxY);
      attempts++;
    } while (attempts < 15 && x > window.innerWidth * 0.3 && x < window.innerWidth * 0.7
                            && y > window.innerHeight * 0.3 && y < window.innerHeight * 0.7);
    noBtn.style.left = x + 'px';
    noBtn.style.top  = y + 'px';
  }

  function clickNo() {
    noCount++;
    moveNoBtn();

    // Stop previous sound
    if (currentAudio) {
        currentAudio.pause();
        currentAudio.currentTime = 0;
    }

    // Play new sound
    currentAudio = playSound(noCount);

    const card = document.getElementById('rage-card');
    card.style.display = 'block';

    const pct = Math.round((noCount / maxRage) * 100);
    document.getElementById('rage-fill').style.width = pct + '%';
    document.getElementById('rage-label').textContent =
        'Rage level: ' + pct + '%';

    const idx = Math.min(noCount - 1, rageMessages.length - 1);
    document.getElementById('rage-msg').textContent =
        rageMessages[idx];

    const imgIdx = Math.min(noCount - 1, IMAGES.length - 1);
    document.getElementById('rage-img').src =
        IMAGES[imgIdx].rage;

    if (noCount >= maxRage) {
        noBtn.style.opacity = '0';
        noBtn.style.pointerEvents = 'none';
        hoverPic.classList.remove('show');

        document.getElementById('rage-msg').textContent =
            "Fine!! No more No button for you. 😤 Just press YES already!";
    }
}

  noBtn.addEventListener('mouseenter', () => {
    if (noCount >= maxRage) return;
    const img = IMAGES[Math.min(noCount, IMAGES.length - 1)];
    hoverImg.src = img.hover;
    hoverPic.querySelector('.pic-caption').textContent = img.caption;
    hoverPic.classList.add('show');
  });

  noBtn.addEventListener('mouseleave', () => {
    hoverPic.classList.remove('show');
  });

  function sayYes() {
    launchConfetti();
    currentAudio.pause();
    playYesSound();
    document.getElementById('question-screen').style.display = 'none';
    document.getElementById('happy-screen').style.display = 'block';
    noBtn.style.display = 'none';
  }

  function playYesSound() {
    try {
      const ctx = getAudioCtx();
      const notes = [523, 659, 784, 1047];
      notes.forEach((freq, i) => {
        playSine(ctx, ctx.destination, freq, 0.4, 'sine', 0.4, i * 0.12);
      });
    } catch(e) {}
  }

  function launchConfetti() {
    const colors = ['#a855f7','#ec4899','#f59e0b','#10b981','#3b82f6','#ef4444','#fbbf24'];
    for (let i = 0; i < 80; i++) {
      setTimeout(() => {
        const el = document.createElement('div');
        el.className = 'confetti-piece';
        const size = 8 + Math.random() * 10;
        el.style.cssText = `width:${size}px;height:${size}px;left:${Math.random()*100}vw;top:-20px;background:${colors[Math.floor(Math.random()*colors.length)]};border-radius:${Math.random()>0.5?'50%':'2px'};animation-duration:${1.5+Math.random()*2}s;`;
        document.body.appendChild(el);
        setTimeout(() => el.remove(), 4000);
      }, i * 30);
    }
  }

  window.addEventListener('load', placeNoBtnInitial);
</script>
</body>
</html>
